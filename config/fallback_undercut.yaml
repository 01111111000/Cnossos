# Fallback question F1 (D-033 as amended by D-037): undercut-salient framing, prefix-only.
# Identical to fallback_p1.yaml except the prompt directory; launched together with it.
extends: legacy_r2.yaml
purpose: fallback_F1_undercut_salient
experiment:
  prefix_only: true
  workers: 1
llm:
  prompt_dir: prompts_fallback_undercut
# D-052: F1 runs on the same provider and model as the main run (the legacy file keeps D-024's).
llm:
  provider: anthropic
  model: claude-haiku-5-5
  temperature: 1.0
  reasoning_effort: medium
  thinking_display: summarized
  max_output_tokens: 4096
budget:
  input_price_per_million: 0.10
  output_price_per_million: 0.50
